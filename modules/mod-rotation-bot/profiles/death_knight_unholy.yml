# Death Knight, Unholy. The profile format and the condition language are described in the README.
# Edit this file and type ".rot reload" in game to apply the changes.
#
# Applies once you know Scourge Strike.

name: Death Knight Unholy
class: death_knight
requires: Scourge Strike
priority: 10
auto_attack: true
aoe_enemies: 3
aoe_radius: 10

lists:
  precombat:
    - cast: Blood Presence
      on: self
      if: not player.aura("Blood Presence", "Frost Presence", "Unholy Presence")

    - cast: Horn of Winter
      on: self
      if: not player.aura("Horn of Winter", "Strength of Earth")

    - cast: Bone Shield
      on: self
      if: not player.my_aura("Bone Shield")

    # Needs a corpse or Corpse Dust, which the server checks.
    - cast: Raise Dead
      on: self
      if: not pet.exists

  defensives:
    - cast: Every Man for Himself
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Lichborne
      on: self
      if: pvp and (player.feared or player.cc_remains > 2)

    - cast: Icebound Fortitude
      on: self
      if: player.health_pct < 35

    - cast: Anti-Magic Shell
      on: self
      if: target.casting and target.targeting_me and not target.cast_heal

    - cast: Death Strike
      if: player.health_pct < 40

  # Waits for the reaction delay.
  interrupts:
    - cast: Mind Freeze
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc)

    - cast: Mind Freeze
      on: enemy_players
      if: unit.cast_interruptible and (unit.cast_heal or unit.cast_cc)

    - cast: Strangulate
      if: pvp and target.casting and (target.cast_heal or target.cast_cc) and target.dr("Strangulate") == 0

  pve_aoe:
    - cast: Pestilence
      if: target.my_aura("Frost Fever") and target.my_aura("Blood Plague")

    - cast: Death and Decay
    - cast: Blood Boil

  pve_st:
    - cast: Raise Dead
      on: self
      if: not pet.exists

    - cast: Bone Shield
      on: self
      if: not player.my_aura("Bone Shield")

    - cast: Chains of Ice
      if: pvp and target.is_player and not target.my_aura("Chains of Ice") and not target.aura("Hand of Freedom")

    - cast: Summon Gargoyle
      if: burst and player.power >= 60

    - cast: Icy Touch
      if: target.my_aura("Frost Fever").remains < 1

    - cast: Plague Strike
      if: target.my_aura("Blood Plague").remains < 1

    - cast: Ghoul Frenzy
      on: self
      if: pet.exists and not pet.my_aura("Ghoul Frenzy")

    - cast: Scourge Strike

    # Blood runes become death runes with Reaping.
    - cast: Blood Strike

    - cast: Death Coil
      if: player.power >= 40

    - cast: Horn of Winter
      on: self
