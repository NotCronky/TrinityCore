# Druid, Restoration (healer). The profile format and the condition language are described in the
# README. Edit this file and type ".rot reload" in game to apply the changes.
#
# Applies once most of your talent points are in Restoration, from level 10. Heals go to your group
# ("on: party": you and your group members within 40 yards, lowest health first), whatever you have
# selected. Solo, it heals you.

name: Druid Restoration
class: druid
spec: restoration
priority: 10

lists:
  precombat:
    - cast: Mark of the Wild
      on: self
      if: not player.aura("Mark of the Wild", "Gift of the Wild")

    - cast: Thorns
      on: self
      if: not player.aura("Thorns")

    # Only from caster form, so it never shifts you out of Travel or Flight Form.
    - cast: Tree of Life
      on: self
      if: not player.aura("Tree of Life", "Moonkin Form", "Cat Form", "Bear Form", "Dire Bear Form", "Travel Form", "Aquatic Form", "Flight Form", "Swift Flight Form")

    # Top the group up after a fight.
    - cast: Rejuvenation
      on: party
      if: unit.health_pct < 90 and not unit.my_aura("Rejuvenation")

    - cast: Regrowth
      on: party
      if: unit.health_pct < 70 and not unit.my_aura("Regrowth")

  defensives:
    - cast: Every Man for Himself
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Barkskin
      on: self
      if: player.health_pct < 40 and player.attackers >= 1

    # Nature's Swiftness makes the next Healing Touch instant.
    - cast: Nature's Swiftness
      on: self
      if: party_below(30) >= 1

    - cast: Healing Touch
      on: party
      if: unit.health_pct < 30 and player.aura("Nature's Swiftness")

    - cast: Innervate
      on: self
      if: player.power_pct < 25

  pve_st:
    - cast: Tranquility
      on: self
      if: burst and party_below(50) >= 3

    # Lifebloom stacked to 3 on whoever the enemies attack most (the tank), refreshed before it
    # blooms.
    - cast: Lifebloom
      on: party
      if: unit.most_attacked and (unit.my_aura("Lifebloom").stacks < 3 or unit.my_aura("Lifebloom").remains < 1.5)

    # Needs your Rejuvenation or Regrowth on the target, which the server checks.
    - cast: Swiftmend
      on: party
      if: unit.health_pct < 50

    - cast: Wild Growth
      on: party
      if: party_below(85) >= 3 and unit.health_pct < 85

    - cast: Rejuvenation
      on: party
      if: unit.health_pct < 90 and not unit.my_aura("Rejuvenation")

    - cast: Regrowth
      on: party
      if: unit.health_pct < 60 and not unit.my_aura("Regrowth")

    - cast: Nourish
      on: party
      if: unit.health_pct < 75

    - cast: Remove Curse
      on: party
      if: unit.dispellable("curse") >= 1

    - cast: Abolish Poison
      on: party
      if: unit.dispellable("poison") >= 1 and not unit.my_aura("Abolish Poison")

    - cast: Tree of Life
      on: self
      if: not player.aura("Tree of Life", "Moonkin Form", "Cat Form", "Bear Form", "Dire Bear Form", "Travel Form", "Aquatic Form", "Flight Form", "Swift Flight Form")

    # Nobody needs healing: fight (caster form only). Solo this is your damage while levelling.
    - cast: Moonfire
      if: target.my_aura("Moonfire").remains < 1 and target.health_pct > 25 and party_below(80) == 0

    - cast: Wrath
      if: party_below(80) == 0 and player.power_pct > 40
