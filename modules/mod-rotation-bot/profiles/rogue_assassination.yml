# Rogue, Assassination. The profile format and the condition language are described in the README.
# Edit this file and type ".rot reload" in game to apply the changes.
#
# Applies once you know Mutilate. Poisons aren't applied for you. Openers need stealth: press
# ".rot next" from stealth.

name: Rogue Assassination
class: rogue
requires: Mutilate
priority: 10
auto_attack: true
aoe_enemies: 3
aoe_radius: 8

lists:
  defensives:
    - cast: Every Man for Himself
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Cloak of Shadows
      on: self
      if: player.dispellable("magic") >= 1 and (pvp or player.health_pct < 50)

    - cast: Evasion
      on: self
      if: player.health_pct < 40 and player.attackers >= 1

    # Peel or stop a burst: 6 s stun at 5 combo points.
    - cast: Kidney Shot
      if: pvp and player.health_pct < 35 and player.combo_points >= 3 and target.dr("Kidney Shot") == 0

  # Waits for the reaction delay.
  interrupts:
    - cast: Kick
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc)

    - cast: Kick
      on: enemy_players
      if: unit.cast_interruptible and (unit.cast_heal or unit.cast_cc)

  pve_aoe:
    - cast: Fan of Knives

  pve_st:
    - cast: Cheap Shot
      if: pvp

    - cast: Garrote
    - cast: Ambush

    - cast: Cold Blood
      on: self
      if: burst and player.combo_points >= 4

    - cast: Slice and Dice
      on: self
      if: player.combo_points >= 1 and player.my_aura("Slice and Dice").remains < 1

    # Needs a bleed on the target, which the server checks.
    - cast: Hunger For Blood
      on: self
      if: player.my_aura("Hunger For Blood").remains < 2

    - cast: Rupture
      if: player.combo_points >= 4 and target.my_aura("Rupture").remains < 1 and (target.is_boss or target.is_player)

    - cast: Envenom
      if: player.combo_points >= 4

    - cast: Tricks of the Trade
      on: party
      if: unit.most_attacked and burst

    - cast: Mutilate
