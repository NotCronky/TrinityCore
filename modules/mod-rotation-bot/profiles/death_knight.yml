# Death Knight, base. Used until a spec profile applies: death_knight_blood.yml (Heart Strike),
# death_knight_frost.yml (Howling Blast) or death_knight_unholy.yml (Scourge Strike). Spells you
# haven't learned yet are skipped. Runes and runic power are checked by the server.
#
# Death Grip pulls the target to you, which is fine; nothing here moves you.

name: Death Knight
class: death_knight
auto_attack: true
aoe_enemies: 3
aoe_radius: 10

lists:
  precombat:
    - cast: Blood Presence
      on: self
      if: not player.aura("Blood Presence", "Frost Presence", "Unholy Presence")

    - cast: Horn of Winter
      on: self
      if: not player.aura("Horn of Winter", "Strength of Earth")

  defensives:
    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Lichborne
      on: self
      if: pvp and (player.feared or player.cc_remains > 2)

    - cast: Icebound Fortitude
      on: self
      if: player.health_pct < 35

    - cast: Anti-Magic Shell
      on: self
      if: target.casting and target.targeting_me and not target.cast_heal

    - cast: Death Strike
      if: player.health_pct < 50

  # Waits for the reaction delay.
  interrupts:
    - cast: Mind Freeze
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc)

    - cast: Mind Freeze
      on: enemy_players
      if: unit.cast_interruptible and (unit.cast_heal or unit.cast_cc)

    - cast: Strangulate
      if: pvp and target.casting and (target.cast_heal or target.cast_cc) and target.dr("Strangulate") == 0

  pve_aoe:
    # Spreads your diseases once they are on the target.
    - cast: Pestilence
      if: target.my_aura("Frost Fever") and target.my_aura("Blood Plague")

    - cast: Death and Decay
    - cast: Blood Boil

  pve_st:
    - cast: Death Grip
      if: pvp and target.distance > 8

    - cast: Chains of Ice
      if: pvp and target.is_player and not target.my_aura("Chains of Ice") and not target.aura("Hand of Freedom")

    - cast: Icy Touch
      if: target.my_aura("Frost Fever").remains < 1

    - cast: Plague Strike
      if: target.my_aura("Blood Plague").remains < 1

    - cast: Obliterate
    - cast: Death Strike
    - cast: Blood Strike

    - cast: Death Coil
      if: player.power >= 60

    - cast: Horn of Winter
      on: self
