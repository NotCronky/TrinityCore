# Rogue, levelling. Used by every rogue until a spec profile applies: rogue_assassination.yml
# (Mutilate), rogue_combat.yml (Blade Flurry) or rogue_subtlety.yml (Hemorrhage). Spells you
# haven't learned yet are skipped, so it works from level 1.
#
# Poisons aren't applied for you (they go on a weapon, not a unit). Openers need stealth: press
# ".rot next" from stealth and the opener starts the fight; no white hit breaks stealth first.
# Sprint, Shadowstep and Vanish are left out.

name: Rogue Levelling
class: rogue
auto_attack: true
aoe_enemies: 3
aoe_radius: 8

lists:
  defensives:
    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Evasion
      on: self
      if: player.health_pct < 40 and player.attackers >= 1

    - cast: Cloak of Shadows
      on: self
      if: pvp and player.dispellable("magic") >= 1

  # Waits for the reaction delay.
  interrupts:
    - cast: Kick
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc)

    - cast: Kick
      on: enemy_players
      if: unit.cast_interruptible and (unit.cast_heal or unit.cast_cc)

    # Gouge interrupts too, when Kick is on cooldown; it breaks on damage.
    - cast: Gouge
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc) and target.dr("Gouge") == 0

  pve_aoe:
    - cast: Blade Flurry
      on: self

    - cast: Fan of Knives

  pve_st:
    # Openers; the server only allows them from stealth.
    - cast: Cheap Shot
      if: pvp

    - cast: Ambush
    - cast: Garrote
    - cast: Cheap Shot

    - cast: Slice and Dice
      on: self
      if: player.combo_points >= 2 and player.my_aura("Slice and Dice").remains < 1

    - cast: Eviscerate
      if: player.combo_points >= 5 or (player.combo_points >= 2 and target.health_pct < 15)

    - cast: Riposte

    # Backstab from behind, Sinister Strike otherwise.
    - cast: Backstab
      if: target.behind

    - cast: Sinister Strike
