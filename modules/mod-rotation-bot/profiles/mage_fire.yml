# Mage, Fire. The profile format and the condition language are described in the README.
# Edit this file and type ".rot reload" in game to apply the changes.
#
# Applies once you know Combustion. Spells with a cast time wait until you stand still.

name: Mage Fire
class: mage
requires: Combustion
priority: 10
aoe_enemies: 3
aoe_radius: 10

lists:
  precombat:
    - cast: Arcane Intellect
      on: self
      if: not player.aura("Arcane Intellect", "Arcane Brilliance", "Dalaran Intellect", "Dalaran Brilliance")

    - cast: Molten Armor
      on: self
      if: not player.my_aura("Molten Armor", "Mage Armor", "Ice Armor", "Frost Armor")

  defensives:
    - cast: Every Man for Himself
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Will of the Forsaken
      on: self
      if: pvp and player.feared and player.cc_remains > 2

    - use: pvp_trinket
      on: self
      if: pvp and player.hard_cc and player.cc_remains > 2

    - cast: Ice Block
      on: self
      if: player.health_pct < 15 and not player.aura("Hypothermia")

    - cast: Frost Nova
      on: self
      if: player.attackers >= 1 and target.in_melee and target.dr("Frost Nova") == 0

    - cast: Mana Shield
      on: self
      if: player.health_pct < 40 and player.attackers >= 1 and player.power_pct > 30

    - use: Mana Sapphire
      on: self
      if: player.power_pct < 70

    - use: Mana Emerald
      on: self
      if: player.power_pct < 70

    - cast: Evocation
      on: self
      if: player.power_pct < 15 and player.attackers == 0

  # Waits for the reaction delay.
  interrupts:
    - cast: Counterspell
      if: target.cast_interruptible and (pve or target.cast_heal or target.cast_cc)

    - cast: Counterspell
      on: enemy_players
      if: unit.cast_interruptible and (unit.cast_heal or unit.cast_cc)

  pve_aoe:
    - cast: Living Bomb
      on: enemies
      if: not unit.my_aura("Living Bomb") and unit.health_pct > 30

    - cast: Blast Wave
      if: enemies(10) >= 3

    - cast: Dragon's Breath
      if: target.in_melee

    # Ground-targeted: lands at the target's feet.
    - cast: Flamestrike
      if: not target.my_aura("Flamestrike")

  pve_st:
    - cast: Combustion
      on: self
      if: burst and (target.is_boss or target.is_player)

    - cast: Mirror Image
      on: self
      if: burst and (target.is_boss or target.is_player)

    - cast: Spellsteal
      if: pvp and target.dispellable("magic") >= 1

    # Hot Streak: an instant Pyroblast.
    - cast: Pyroblast
      if: player.aura("Hot Streak")

    - cast: Living Bomb
      if: not target.my_aura("Living Bomb") and target.health_pct > 15

    # Keeps the 5% spell crit debuff up when nobody else provides it.
    - cast: Scorch
      if: target.is_boss and not target.aura("Improved Scorch", "Winter's Chill", "Shadow Mastery")

    - cast: Fireball

    - cast: Fire Blast
      if: player.moving

    - cast: Scorch
      if: player.moving
